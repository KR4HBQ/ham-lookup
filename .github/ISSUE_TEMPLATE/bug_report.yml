name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste your `.env`, passwords or API keys here.** Remove them from any log or
        screenshot first. Club Log revokes any application key it finds on GitHub.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: callsign
    attributes:
      label: Callsign looked up (if relevant)
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options:
        - Docker Compose
        - Docker (rebuild.sh / Unraid)
        - python app.py
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `git rev-parse --short HEAD`, or the release you're on.
  - type: dropdown
    id: log_source
    attributes:
      label: Log source (LOG_SOURCE)
      options:
        - Not relevant
        - Wavelog
        - QRZ Logbook
        - Club Log
        - LoTW
        - World Radio League
        - ADIF file
  - type: dropdown
    id: log_write
    attributes:
      label: Loggers you write to (LOG_WRITE)
      multiple: true
      options:
        - Not relevant
        - Wavelog
        - Cloudlog
        - QRZ Logbook
        - Club Log
        - World Radio League
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: For Docker, `docker compose logs --tail 100`. Check that no keys are in it.
      render: text
  - type: checkboxes
    id: keys
    attributes:
      label: Check
      options:
        - label: I removed all passwords and API keys from this report.
          required: true
